id: negatif-login
title: Hatali sifre ile login SOAP fault donmeli
tags: [negatif, hesap]
steps:
  - name: Yanlis sifre
    service: HesapServisi
    operation: Login
    params:
      kullaniciAdi: "{{env.kullanici}}"
      sifre: "YanlisSifre-{{$random_digits(4)}}"
    assert:
      - fault: { code: Client, message_contains: "hatalı" }

  - name: Gecersiz token ile bakiye
    service: HesapServisi
    operation: GetBakiye
    params:
      token: "gecersiz-{{$uuid}}"
      musteriNo: "{{env.musteri_no}}"
    assert:
      - fault: any
      - path: $
        isNull: true
