id: rest-yetkilendirme
title: REST token alma ve yetkisiz erisim kontrolleri
tags: [smoke, negatif, rest]
steps:
  - name: Token al
    service: HesapApi
    method: POST
    path: /auth/token
    body:
      username: "{{env.kullanici}}"
      password: "{{env.demo_sifre}}"
    assert:
      - status: 200
      - path: $.token_type
        equals: Bearer
      - path: $.expires_in
        numeric: { gt: 0 }
    extract:
      accessToken: $.access_token

  - name: Tokensiz erisim 401
    service: HesapApi
    method: GET
    path: /hesaplar/1000001-1
    assert:
      - status: 401
      - path: $.error
        equals: unauthorized

  - name: Olmayan hesap 404
    service: HesapApi
    method: GET
    path: /hesaplar/9999999-9
    headers: { Authorization: "Bearer {{accessToken}}" }
    assert:
      - status: 404
      - path: $.message
        contains: bulunamadı
