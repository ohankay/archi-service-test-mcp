# Demo catalogue for the local demo services:  service-test-mcp --demo-server  (http://127.0.0.1:8899)
default_environment: test

environments:
  test:
    description: Local demo services
    timeout_s: 15
    allow_mutating: false          # operations such as TransferYap are blocked
    variables:                     # used in scenarios as {{env.name}} (test data per environment)
      user: demo
      demo_password: Demo123!      # DEMO ONLY. Real passwords are given with {{secret.STM_SECRET_...}}.
      customer_no: "1000001"

services:
  HesapServisi:
    protocol: soap
    description: WCF basicHttpBinding demo service (Login, GetBakiye, TransferYap)
    wsdl:
      test: http://127.0.0.1:8899/HesapServisi.svc?wsdl
    mutating_operations: [TransferYap]

  HesapApi:
    protocol: rest
    description: Account REST API (Bearer token)
    base_url:
      test: http://127.0.0.1:8899/api
    mutating_operations: ["DELETE /*"]

masking:
  enabled: true
  keep_last: 4

scenario_root: .
