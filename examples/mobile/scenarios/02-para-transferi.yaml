id: mobil-para-transferi
title: IBAN'a para transferi ve gecersiz tutar (negatif)
tags: [transfer, mobil]
test_customer: bireysel_havuz          # bakiye degistiren testler havuzdan musteri kullanir
steps:
  - name: Transfer oncesi bakiye
    service: MobilBankacilik
    operation: GetDashBoardMobileInformation
    params: { MainResourceCode: DASHBOARD }
    assert:
      - success: true
    extract:
      oncekiBakiye: $.Value.Accounts[0].Balance

  - name: Para transferi
    service: MobilBankacilik
    operation: ExecuteMoneyTransfer
    params:
      ToIban: "{{env.hedef_iban}}"
      Amount: "10.00"
      Description: otomatik test
      TransferType: 1
    assert:
      - success: true
      - path: $.Value.TransactionId
        matches: "^TRX[0-9A-F]{10}$"
      - path: $.Value.NewBalance
        numeric: { lt: "{{oncekiBakiye}}" }

  - name: Sifir tutarla transfer reddedilir
    service: MobilBankacilik
    operation: ExecuteMoneyTransfer
    params:
      ToIban: "{{env.hedef_iban}}"
      Amount: "0"
      Description: negatif test
      TransferType: 1
    assert:
      - success: false
      - path: $.Results[0].ErrorCode
        equals: INVALID_AMOUNT
