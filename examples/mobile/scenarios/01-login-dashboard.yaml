id: mobile-login-dashboard
title: Automatic login (app + customer + OTP) and the home page
tags: [smoke, mobile]
test_customer: retail_standard
steps:
  - name: App pre-data (no session)
    service: MobileBanking
    operation: ApplicationPreData
    assert:
      - success: true
      - path: $.Value.MinVersion
        matches: "^\\d+\\.\\d+\\.\\d+$"

  - name: Home page
    service: MobileBanking
    operation: GetDashBoardMobileInformation
    params:
      MainResourceCode: DASHBOARD
    assert:
      - success: true
      - path: $.Value.Accounts
        count: { gte: 1 }
      - path: $.Value.Accounts[*].Iban
        matches: "^TR\\d{24}$"
        all: true
      - path: $.Value.Accounts[*].Balance
        type: number
        all: true
      - responseTimeMs: { lt: 3000 }

  - name: Profile basics (same session)
    service: MobileBanking
    operation: GetProfileBasics
    assert:
      - success: true
      - path: $.Value.CustomerId
        equals: "{{test_customer.CustomerId}}"
