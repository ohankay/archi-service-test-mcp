# Draft scenario generated from a traffic log. Login is done by the profile, so login steps are
# not listed. Masked values (***) and personal data must be replaced with {{env.x}} /
# test_customer fields before this is used as a regression test.
id: sample-prep-transaction-flow
title: 'MobileBanking: flow made from the log sample-prep-transaction.log'
tags:
- draft
- from-log
source_log: sample-prep-transaction.log
test_customer: retail_standard
steps:
- name: ApplicationPreData
  service: MobileBanking
  operation: ApplicationPreData
  assert:
  - success: true
- name: GetDashBoardMobileInformation
  service: MobileBanking
  operation: GetDashBoardMobileInformation
  params:
    MainResourceCode: DASHBOARD
  assert:
  - success: true
- name: GetProfileBasics
  service: MobileBanking
  operation: GetProfileBasics
  assert:
  - success: true
- name: ExecuteMoneyTransfer
  service: MobileBanking
  operation: ExecuteMoneyTransfer
  params:
    ToIban: '**********************7890'
    Amount: '25.50'
    Description: rent
    TransferType: 1
  assert:
  - success: true
